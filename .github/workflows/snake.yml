name: Generate Snake Animation

on:
  schedule:
    # Refresh the contribution snake once a day at 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate pixel snake from contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#1A7F37
            dist/snake-dark.svg?palette=github-dark&color_snake=#7CE38B

      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # snk is a Docker action and runs as root, so dist/ comes back
          # root-owned. Hand it to the runner before git touches it.
          sudo chown -R "$(id -u):$(id -g)" dist
          git config --global --add safe.directory "$PWD/dist"

          ls -la dist

          cd dist
          git init -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate contribution snake"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
